name: Vercel Check

# Triggered by Vercel via repository_dispatch when a deployment
# requests custom checks (Project Settings → Git → Checks).
on:
  repository_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  vercel-check:
    name: vercel check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Check (typecheck)
        run: pnpm typecheck
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - hitung-swdkllj: vercel check'
